<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodBridge – Food Surplus Prediction & Redistribution</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">🍲 FoodBridge <span>Predict surplus · Feed nearby</span></div>
    <div id="userbox" class="userbox hidden"></div>
  </header>

  <main>
    <!-- AUTH -->
    <section id="auth" class="auth">
      <div class="card hero">
        <h1>Stop good food becoming waste.</h1>
        <p>FoodBridge predicts surplus before it happens and matches it with verified NGOs, shelters and community kitchens within minutes of pickup.</p>
        <h3>Quick demo login <small>(password: password123)</small></h3>
        <div class="chips">
          <button class="chip" data-demo="hotel@demo.com">🏨 Donor</button>
          <button class="chip" data-demo="kitchen@demo.com">🏠 Receiver</button>
          <button class="chip" data-demo="admin@demo.com">🛡️ Admin</button>
        </div>
      </div>

      <div class="card">
        <div class="tabs small">
          <button id="tabLogin" class="active">Login</button>
          <button id="tabReg">Register</button>
        </div>

        <form id="loginForm">
          <label>Email<input name="email" type="email" required /></label>
          <label>Password<input name="password" type="password" required /></label>
          <button class="btn" type="submit">Login</button>
        </form>

        <form id="regForm" class="hidden">
          <label>I am a
            <select name="role" id="regRole">
              <option value="donor">Donor (restaurant, hotel, store, event…)</option>
              <option value="receiver">Receiver (NGO, shelter, kitchen, food bank)</option>
            </select>
          </label>
          <label>Organisation name<input name="name" required /></label>
          <label>Email<input name="email" type="email" required /></label>
          <label>Password (min 6)<input name="password" type="password" minlength="6" required /></label>
          <label>Phone<input name="phone" /></label>
          <label>Address<input name="address" /></label>
          <div id="receiverFields" class="hidden">
            <label>Capacity per pickup (kg)<input name="capacityKg" type="number" min="1" value="50" /></label>
            <label>Service radius (km)<input name="radiusKm" type="number" min="1" max="50" value="10" /></label>
            <label>Pickup hours<span class="row"><input name="pickupFrom" type="number" min="0" max="23" value="8" /><input name="pickupTo" type="number" min="0" max="23" value="22" /></span></label>
            <fieldset id="typeBoxes"><legend>Food types accepted</legend></fieldset>
          </div>
          <label>Location <small>(click the map or use GPS)</small></label>
          <div id="regMap" class="map small"></div>
          <button type="button" class="btn ghost" id="gpsBtn">📍 Use my current location</button>
          <input type="hidden" name="lat" /><input type="hidden" name="lng" />
          <button class="btn" type="submit">Create account</button>
        </form>
        <p id="authMsg" class="msg"></p>
      </div>
    </section>

    <!-- APP -->
    <section id="app" class="hidden">
      <nav id="nav" class="tabs"></nav>
      <div id="view"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
